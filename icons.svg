<!-- SVG Icon System для EduPlatform -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="iconGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon - Books/Education -->
  <symbol id="icon-logo" viewBox="0 0 24 24">
    <path fill="url(#iconGradient)" d="M19 2H9c-1.1 0-2 .9-2 2v5.5h2V4h10v16h-5v2h5c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
    <path fill="url(#iconGradient)" d="M13 13.5V22l-4-2-4 2v-8.5C5 11.57 6.57 10 8.5 10s3.5 1.57 3.5 3.5z"/>
  </symbol>
  
  <!-- Calendar/Schedule Icon -->
  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
    <line x1="16" y1="2" x2="16" y2="6" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="2" x2="8" y2="6" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="10" x2="21" y2="10" stroke="url(#iconGradient)" stroke-width="2"/>
    <rect x="7" y="14" width="3" height="3" fill="url(#iconGradient)"/>
  </symbol>
  
  <!-- Document/Assignment Icon -->
  <symbol id="icon-document" viewBox="0 0 24 24">
    <path fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14,2 14,8 20,8" fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="9" y1="13" x2="15" y2="13" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="17" x2="15" y2="17" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Bell/Notification Icon -->
  <symbol id="icon-bell" viewBox="0 0 24 24">
    <path fill="url(#iconGradient)" d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path fill="url(#iconGradient)" d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </symbol>
  
  <!-- Chart/Analytics Icon -->
  <symbol id="icon-chart" viewBox="0 0 24 24">
    <line x1="18" y1="20" x2="18" y2="10" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="20" x2="12" y2="4" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="20" x2="6" y2="14" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  
  <!-- Teacher/User Icon -->
  <symbol id="icon-teacher" viewBox="0 0 24 24">
    <path fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
    <polyline points="16,11 19,8 22,11" fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
  <!-- Settings/Admin Icon -->
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
    <path fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 1v6m0 6v6m6-11h-6m-6 0H1m16.5-2.5l-4.2 4.2m-6.6 0L2.5 5.5m12 12l4.2 4.2m-12 0l-4.2-4.2"/>
  </symbol>
  
  <!-- Student/Graduation Icon -->
  <symbol id="icon-student" viewBox="0 0 24 24">
    <path fill="url(#iconGradient)" d="M22 10l-10-5-10 5 10 5z"/>
    <path fill="url(#iconGradient)" d="M6 13.26V16c0 2.21 2.69 4 6 4s6-1.79 6-4v-2.74L12 15z"/>
  </symbol>
  
  <!-- Crown/Admin Icon -->
  <symbol id="icon-crown" viewBox="0 0 24 24">
    <path fill="url(#iconGradient)" d="M12 2l2 6 6-2-3 7h-10l-3-7 6 2z"/>
    <rect x="4" y="13" width="16" height="2" fill="url(#iconGradient)"/>
    <path fill="url(#iconGradient)" d="M5 18h14v3a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/>
  </symbol>
  
  <!-- React/Atom Icon -->
  <symbol id="icon-react" viewBox="0 0 24 24">
    <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="url(#iconGradient2)" stroke-width="1.5"/>
    <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)" fill="none" stroke="url(#iconGradient2)" stroke-width="1.5"/>
    <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)" fill="none" stroke="url(#iconGradient2)" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="2" fill="url(#iconGradient2)"/>
  </symbol>
  
  <!-- Database Icon -->
  <symbol id="icon-database" viewBox="0 0 24 24">
    <ellipse cx="12" cy="5" rx="9" ry="3" fill="none" stroke="url(#iconGradient2)" stroke-width="2"/>
    <path fill="none" stroke="url(#iconGradient2)" stroke-width="2" d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
    <path fill="none" stroke="url(#iconGradient2)" stroke-width="2" d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  </symbol>
  
  <!-- Shield/Security Icon -->
  <symbol id="icon-shield" viewBox="0 0 24 24">
    <path fill="url(#iconGradient2)" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path fill="rgba(10,10,15,0.9)" d="M12 8l4 4-4 4-4-4z"/>
  </symbol>
  
  <!-- Lightning/Speed Icon -->
  <symbol id="icon-lightning" viewBox="0 0 24 24">
    <path fill="url(#iconGradient2)" d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
  </symbol>
  
  <!-- Palette/Design Icon -->
  <symbol id="icon-palette" viewBox="0 0 24 24">
    <path fill="url(#iconGradient2)" d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c1.38 0 2.5-.56 2.5-1.25 0-.34-.14-.66-.38-.92-.23-.25-.38-.58-.38-.83 0-.69.56-1.25 1.25-1.25H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9z"/>
    <circle cx="7" cy="10" r="1.5" fill="rgba(10,10,15,0.9)"/>
    <circle cx="11" cy="7" r="1.5" fill="rgba(10,10,15,0.9)"/>
    <circle cx="15" cy="10" r="1.5" fill="rgba(10,10,15,0.9)"/>
    <circle cx="13" cy="14" r="1.5" fill="rgba(10,10,15,0.9)"/>
  </symbol>
  
  <!-- Optimize/Target Icon -->
  <symbol id="icon-target" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="none" stroke="url(#iconGradient2)" stroke-width="2"/>
    <circle cx="12" cy="12" r="6" fill="none" stroke="url(#iconGradient2)" stroke-width="2"/>
    <circle cx="12" cy="12" r="2" fill="url(#iconGradient2)"/>
  </symbol>
  
  <!-- Sparkles/Badge Icon -->
  <symbol id="icon-sparkles" viewBox="0 0 24 24">
    <path fill="url(#iconGradient)" d="M12 0l3 9h9l-7 5 3 9-8-6-8 6 3-9-7-5h9z"/>
  </symbol>
  
  <!-- Arrow Right Icon -->
  <symbol id="icon-arrow-right" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
  </symbol>
  
  <!-- Check Icon -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12" fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  
  <!-- Folder/Materials Icon -->
  <symbol id="icon-folder" viewBox="0 0 24 24">
    <path fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
  </symbol>

  <!-- Steps/Timeline Icon -->
  <symbol id="icon-steps" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="3" fill="url(#iconGradient)"/>
    <circle cx="12" cy="12" r="3" fill="url(#iconGradient)"/>
    <circle cx="12" cy="19" r="3" fill="url(#iconGradient)"/>
  </symbol>

</svg>

